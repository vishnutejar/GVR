<div class="appointments-page">
  <div class="appointments-container">
    <div class="panel-header">
      <h2>Book an appointment at your closest GVR Clinic</h2>
      <p>Choose a service, select a date, and tell us your concerns.</p>
    </div>

    <form class="appointment-form" (ngSubmit)="bookAppointment()">

      <div class="form-group">
        <label for="serviceType">Service Type</label>
        <select id="serviceType" name="serviceType" class="form-control" required [(ngModel)]="serviceTypes">
          <option value="" disabled>Select a service</option>
          <option *ngFor="let type of serviceTypesList()" [value]="type.serviceTypeId">
            {{type.name}}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label for="appointmentDate">Appointment Date & Time</label>
        <input id="appointmentDate" name="appointmentDate" type="datetime-local" [(ngModel)]="appointmentDate"
          required />
      </div>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input id="fullName" name="fullName" type="text" [(ngModel)]="name" required
          placeholder="Enter your full name" />
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" [(ngModel)]="phoneNumber" required placeholder="Enter your phone number" />
      </div>
      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" [(ngModel)]="notes" required
          placeholder="Describe your dental needs"></textarea>
      </div>

      <div class="message success" *ngIf="success()">{{ success() }}</div>
      <div class="message error" *ngIf="error()">{{ error() }}</div>

      <button class="btn btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Booking...' : 'Book Appointment' }}
      </button>
    </form>
